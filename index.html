<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4d91">
<title>FB Embalagens — Catálogo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#222}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 12px}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;color:#0b4d91;font-size:20px}
.search{flex:1;padding:12px 14px;border:1px solid #d8dee8;border-radius:12px;font-size:16px;outline:none;min-width:120px}
.authbtn{border:1px solid #0b4d91;background:#fff;color:#0b4d91;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.authbtn.solid{background:#0b4d91;color:#fff}
nav{max-width:1100px;margin:10px auto 0;display:flex;gap:8px;overflow:auto;padding-bottom:10px}
nav button{white-space:nowrap;border:1px solid #d8dee8;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}
nav button.active{background:#0b4d91;color:#fff;border-color:#0b4d91}
main{max-width:1100px;margin:18px auto;padding:0 12px 90px}
.title{font-size:22px;font-weight:700;color:#0b4d91;margin:10px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:9px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative}
.card img{width:100%;height:165px;object-fit:contain;background:#fafafa;border-radius:10px;cursor:zoom-in}
.name{font-weight:700;font-size:14px;margin:9px 3px 2px;line-height:1.25}
.cat{font-size:12px;color:#777;margin:0 3px 3px}
.empty{padding:40px;text-align:center;color:#777}
.admin-actions{display:flex;gap:6px;margin-top:6px}
.admin-actions button{flex:1;font-size:12px;padding:6px;border-radius:8px;border:1px solid #d8dee8;background:#fff;cursor:pointer}
.admin-actions .del{color:#b3413a;border-color:#b3413a}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;touch-action:none}
#big{position:absolute;left:50%;top:50%;max-width:92vw;max-height:82vh;transform:translate(-50%,-50%);object-fit:contain;touch-action:none;user-select:none}
.close{position:absolute;right:14px;top:5px;color:#fff;font-size:42px;z-index:30;line-height:1;cursor:pointer}
.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:30}
.controls button{width:52px;height:46px;border:0;border-radius:24px;font-size:22px}
.hint{position:absolute;bottom:75px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.8}
@media(max-width:600px){.top{flex-wrap:wrap}.search{min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card img{height:145px}.name{font-size:13px}}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modalbox{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:360px;max-height:90vh;overflow:auto}
.modalbox h2{margin-top:0;font-size:1.1rem;color:#0b4d91}
.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:10px;margin:7px 0;border:1px solid #d8dee8;border-radius:8px;font-size:.9rem;font-family:inherit}
.modalbox .row{display:flex;gap:8px;margin-top:10px}
.modalbox .row button{flex:1;padding:10px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.modalbox .row .ok{background:#0b4d91;color:#fff}
.modalbox .row .no{background:#eee;color:#333}
#loginErro{color:#b3413a;font-size:.8rem;min-height:16px}

#fabNovo{position:fixed;bottom:22px;right:22px;background:#0b4d91;color:#fff;border:0;border-radius:50px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;z-index:20;cursor:pointer}
#fabImportar{position:fixed;bottom:22px;left:22px;background:#1a8a4a;color:#fff;border:0;border-radius:50px;padding:12px 16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;z-index:20;cursor:pointer;font-size:13px}
</style>
</head>

<header>
<div class="top">
  <div class="logo">FB Embalagens</div>

</header>
<main><div class="title">Catálogo</div><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">Nenhum produto encontrado.</div></main>

<button id="fabNovo">+ Novo produto</button>

<div class="overlay" id="overlayLogin">

    <div class="row">
      <button class="no" id="cancelarLogin">Cancelar</button>
      <button class="ok" id="confirmarLogin">Entrar</button>
    </div>
  </div>
</div>

<!-- Modal Produto -->
<div class="overlay" id="overlayProduto">

    <select id="pCat"></select>
    <input type="text" id="pSrc" placeholder="images/produto_XXX.jpg ou URL da imagem">
    <div class="row">
      <button class="no" id="cancelarProduto">Cancelar</button>
      <button class="ok" id="salvarProduto">Salvar</button>
    </div>
  </div>
</div>

const categories = ["Todos", "Caixas", "Copos", "Descartáveis/EPI", "Limpeza", "Marmitex", "Papéis e Filmes", "Potes", "Sacolas e Sacos"];

let currentCat='Todos', query='';
let usuarioLogado = null;
let produtos = [];

const grid=document.getElementById('grid'), catsEl=document.getElementById('cats'), search=document.getElementById('search');
const btnLogin=document.getElementById('btnLogin'), btnLogout=document.getElementById('btnLogout');
const fabNovo=document.getElementById('fabNovo'), fabImportar=document.getElementById('fabImportar');

catsEl.innerHTML=categories.map(c=>`<button class="${c==='Todos'?'active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
window.setCat=function(c){currentCat=c;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===c));render()};
search.addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});

function render(){
  const arr=produtos.filter(p=>(currentCat==='Todos'||p.cat===currentCat)&&(!query||p.name.toLowerCase().includes(query)||p.cat.toLowerCase().includes(query)));
  grid.innerHTML=arr.map(p=>`
    <article class="card">
      <img src="${p.src}" alt="${p.name}" loading="lazy" onclick="openModal('${p.src.replace(/'/g,"\\'")}')">
      <div class="name">${p.name}</div>
      <div class="cat">${p.cat}</div>
      ${usuarioLogado ? `<div class="admin-actions">
        <button onclick="editarProduto('${p.id}')">Editar</button>
        <button class="del" onclick="excluirProduto('${p.id}')">Excluir</button>
      </div>` : ''}
    </article>
  `).join('');
  document.getElementById('empty').style.display=arr.length?'none':'block';
}

// ---------- FIRESTORE (tempo real) ----------
const produtosRef = collection(db,'produtos');
onSnapshot(produtosRef,(snap)=>{
  produtos = [];
  snap.forEach(d=>produtos.push({id:d.id, ...d.data()}));
  render();
  fabImportar.style.display = (usuarioLogado && produtos.length===0) ? 'block' : 'none';
});

// ---------- AUTENTICAÇÃO ----------
onAuthStateChanged(auth,(user)=>{
  usuarioLogado = user;
  btnLogin.style.display = user ? 'none' : 'inline-block';
  btnLogout.style.display = user ? 'inline-block' : 'none';
  fabNovo.style.display = user ? 'block' : 'none';
  fabImportar.style.display = (user && produtos.length===0) ? 'block' : 'none';
  render();
});

btnLogin.onclick=()=>{document.getElementById('loginErro').textContent='';document.getElementById('overlayLogin').classList.add('show')};
document.getElementById('cancelarLogin').onclick=()=>document.getElementById('overlayLogin').classList.remove('show');
document.getElementById('confirmarLogin').onclick=async()=>{
  const email=document.getElementById('loginEmail').value.trim();
  const senha=document.getElementById('loginSenha').value;
  try{
    await signInWithEmailAndPassword(auth,email,senha);
    document.getElementById('overlayLogin').classList.remove('show');
    document.getElementById('loginEmail').value='';document.getElementById('loginSenha').value='';
  }catch(e){document.getElementById('loginErro').textContent='E-mail ou senha inválidos.'}
};
btnLogout.onclick=()=>signOut(auth);

// ---------- CRUD PRODUTO ----------
const overlayProduto=document.getElementById('overlayProduto');
const pCatSelect=document.getElementById('pCat');
pCatSelect.innerHTML = categories.filter(c=>c!=='Todos').map(c=>`<option value="${c}">${c}</option>`).join('');

fabNovo.onclick=()=>abrirModalProduto();
function abrirModalProduto(p=null){
  document.getElementById('tituloModalProduto').textContent = p ? 'Editar produto' : 'Novo produto';
  document.getElementById('produtoId').value = p ? p.id : '';
  document.getElementById('pNome').value = p ? p.name : '';
  pCatSelect.value = p ? p.cat : categories[1];
  document.getElementById('pSrc').value = p ? p.src : '';
  overlayProduto.classList.add('show');
}
document.getElementById('cancelarProduto').onclick=()=>overlayProduto.classList.remove('show');
document.getElementById('salvarProduto').onclick=async()=>{
  const id=document.getElementById('produtoId').value;
  const dados={
    name: document.getElementById('pNome').value.trim(),
    cat: pCatSelect.value,
    src: document.getElementById('pSrc').value.trim()
  };
  if(!dados.name){alert('Digite o nome do produto.');return}
  try{
    if(id){ await updateDoc(doc(db,'produtos',id),dados) }
    else{ await addDoc(produtosRef,dados) }
    overlayProduto.classList.remove('show');
  }catch(e){alert('Erro ao salvar: '+e.message)}
};

window.editarProduto=(id)=>{const p=produtos.find(x=>x.id===id);if(p)abrirModalProduto(p)};
window.excluirProduto=async(id)=>{
  if(!confirm('Excluir este produto?'))return;
  try{await deleteDoc(doc(db,'produtos',id))}catch(e){alert('Erro ao excluir: '+e.message)}
};

// ---------- IMPORTAÇÃO ÚNICA (166 produtos originais) ----------
fabImportar.onclick=async()=>{
  if(!confirm('Importar os '+SEED_PRODUCTS.length+' produtos originais para o Firestore?'))return;
  fabImportar.disabled=true;
  fabImportar.textContent='Importando...';
  try{
    const checagem = await getDocs(produtosRef);
    if(!checagem.empty){alert('Já existem produtos no banco. Importação cancelada para não duplicar.');fabImportar.style.display='none';return}
    let batch = writeBatch(db);
    let count = 0;
    for(const p of SEED_PRODUCTS){
      const novoDoc = doc(produtosRef);
      batch.set(novoDoc, p);
      count++;
      if(count % 400 === 0){ await batch.commit(); batch = writeBatch(db); }
    }
    await batch.commit();
    alert('Importação concluída!');
    fabImportar.style.display='none';
  }catch(e){
    alert('Erro na importação: '+e.message);
    fabImportar.disabled=false;
    fabImportar.textContent='Importar 166 produtos';
  }
};

// ---------- MODAL DE ZOOM DE IMAGEM ----------
let scale=1, tx=0, ty=0, dragging=false, startX=0,startY=0;
const modal=document.getElementById('modal'), big=document.getElementById('big');
window.openModal=function(src){big.src=src;scale=1;tx=0;ty=0;update();modal.style.display='block'};
window.closeModal=function(){modal.style.display='none'};
function update(){big.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`}
window.changeZoom=function(v){scale=Math.max(.6,Math.min(5,scale+v));update()};
window.resetZoom=function(){scale=1;tx=0;ty=0;update()};
big.addEventListener('wheel',e=>{e.preventDefault();changeZoom(e.deltaY<0?.2:-.2)},{passive:false});
big.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX-tx;startY=e.clientY-ty;big.setPointerCapture(e.pointerId)});
big.addEventListener('pointermove',e=>{if(!dragging)return;tx=e.clientX-startX;ty=e.clientY-ty;update()});
big.addEventListener('pointerup',()=>dragging=false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
</script>
