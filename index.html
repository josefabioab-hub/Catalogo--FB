<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Online</title>
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --ink:#1c1b19; --muted:#6b6862;
    --accent:#b5651d; --accent-dark:#8f4e15; --line:#e7e4de; --danger:#b3413a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
  }
  header{
    padding:28px 20px 18px; text-align:center; border-bottom:1px solid var(--line);
    background:var(--card);
  }
  header h1{margin:0 0 4px; font-size:1.6rem; letter-spacing:.5px;}
  header p{margin:0; color:var(--muted); font-size:.9rem;}

  .topbar{
    display:flex; justify-content:center; gap:10px; padding:14px 20px;
  }
  button{
    cursor:pointer; border:none; border-radius:8px; padding:9px 16px;
    font-size:.9rem; font-weight:600; transition:.15s;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn-ghost:hover{background:#f3e6d8;}
  .btn-danger{background:var(--danger); color:#fff;}

  #grid{
    display:grid; gap:18px; padding:10px 20px 60px;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    max-width:1100px; margin:0 auto;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .card img{width:100%; height:170px; object-fit:cover; background:#eee;}
  .card-body{padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:6px;}
  .card-body h3{margin:0; font-size:1rem;}
  .card-body .preco{color:var(--accent-dark); font-weight:700;}
  .card-body p{margin:0; font-size:.82rem; color:var(--muted); flex:1;}
  .card-actions{display:flex; gap:8px; padding:0 14px 12px;}
  .card-actions button{flex:1; font-size:.78rem; padding:6px 8px;}

  #vazio{text-align:center; color:var(--muted); padding:40px; grid-column:1/-1;}

  /* Modal login */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:14px; padding:26px; width:100%; max-width:340px;
  }
  .modal h2{margin-top:0; font-size:1.1rem;}
  .modal input{
    width:100%; padding:10px; margin:8px 0; border:1px solid var(--line);
    border-radius:8px; font-size:.9rem;
  }
  .modal .row{display:flex; gap:8px; margin-top:12px;}
  .modal .row button{flex:1;}
  #loginErro{color:var(--danger); font-size:.8rem; min-height:16px;}

  /* Modal produto */
  .modal-produto{max-width:420px;}
  .modal-produto textarea{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:.9rem; resize:vertical; min-height:70px; margin:8px 0;
  }
  label{font-size:.78rem; color:var(--muted); display:block; margin-top:8px;}

  #fabNovo{
    position:fixed; bottom:24px; right:24px; border-radius:50px; padding:14px 22px;
    box-shadow:0 4px 14px rgba(0,0,0,.2); display:none; z-index:20;
  }
  .status{text-align:center; color:var(--muted); font-size:.85rem; padding:16px;}
</style>
</head>
<body>

<header>
  <h1>Catálogo Online</h1>
  <p>Confira nossos produtos</p>
</header>

<div class="topbar">
  <button id="btnLogin" class="btn-ghost">Entrar (admin)</button>
  <button id="btnLogout" class="btn-ghost" style="display:none;">Sair</button>
</div>

<div id="status" class="status">Carregando produtos...</div>
<div id="grid"></div>

<button id="fabNovo" class="btn-primary">+ Novo produto</button>

<!-- Modal Login -->
<div class="overlay" id="overlayLogin">
  <div class="modal">
    <h2>Login do administrador</h2>
    <input type="email" id="loginEmail" placeholder="E-mail">
    <input type="password" id="loginSenha" placeholder="Senha">
    <div id="loginErro"></div>
    <div class="row">
      <button class="btn-ghost" id="cancelarLogin">Cancelar</button>
      <button class="btn-primary" id="confirmarLogin">Entrar</button>
    </div>
  </div>
</div>

<!-- Modal Produto -->
<div class="overlay" id="overlayProduto">
  <div class="modal modal-produto">
    <h2 id="tituloModalProduto">Novo produto</h2>
    <input type="hidden" id="produtoId">
    <label>Nome</label>
    <input type="text" id="pNome" placeholder="Nome do produto">
    <label>Preço (número, ex: 49.90)</label>
    <input type="number" step="0.01" id="pPreco" placeholder="0.00">
    <label>URL da imagem</label>
    <input type="text" id="pImagem" placeholder="https://...">
    <label>Descrição</label>
    <textarea id="pDescricao" placeholder="Descrição do produto"></textarea>
    <div class="row">
      <button class="btn-ghost" id="cancelarProduto">Cancelar</button>
      <button class="btn-primary" id="salvarProduto">Salvar</button>
    </div>
  </div>
</div>

<!-- Firebase SDK (v10, modular via CDN com import map) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, addDoc, updateDoc,
  deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// >>> COLE AQUI a config do seu projeto Firebase (Configurações do projeto > Config do SDK) <<<
const firebaseConfig = {
  apiKey: "AIzaSyAnL0aBzTu_9pUIDcilDm12Vo2eQwiOpVc",
  authDomain: "catalogo-fb-embalagens.firebaseapp.com",
  projectId: "catalogo-fb-embalagens",
  storageBucket: "catalogo-fb-embalagens.firebasestorage.app",
  messagingSenderId: "817675171881",
  appId: "1:817675171881:web:64451ddf8b0689f5b04438"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const btnLogin = document.getElementById('btnLogin');
const btnLogout = document.getElementById('btnLogout');
const fabNovo = document.getElementById('fabNovo');

let usuarioLogado = null;
let produtosCache = [];

// ---------- AUTENTICAÇÃO ----------
onAuthStateChanged(auth, (user) => {
  usuarioLogado = user;
  btnLogin.style.display = user ? 'none' : 'inline-block';
  btnLogout.style.display = user ? 'inline-block' : 'none';
  fabNovo.style.display = user ? 'block' : 'none';
  renderizar(); // re-renderiza pra mostrar/esconder botões editar/excluir
});

document.getElementById('btnLogin').onclick = () => {
  document.getElementById('loginErro').textContent = '';
  document.getElementById('overlayLogin').classList.add('show');
};
document.getElementById('cancelarLogin').onclick = () => {
  document.getElementById('overlayLogin').classList.remove('show');
};
document.getElementById('confirmarLogin').onclick = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    document.getElementById('overlayLogin').classList.remove('show');
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginSenha').value = '';
  } catch (e) {
    document.getElementById('loginErro').textContent = 'E-mail ou senha inválidos.';
  }
};
btnLogout.onclick = () => signOut(auth);

// ---------- LEITURA EM TEMPO REAL ----------
const produtosRef = collection(db, 'produtos');
onSnapshot(produtosRef, (snapshot) => {
  produtosCache = [];
  snapshot.forEach(docSnap => {
    produtosCache.push({ id: docSnap.id, ...docSnap.data() });
  });
  statusEl.style.display = 'none';
  renderizar();
}, (erro) => {
  statusEl.textContent = 'Erro ao carregar: ' + erro.message;
});

function renderizar() {
  grid.innerHTML = '';
  if (produtosCache.length === 0) {
    grid.innerHTML = '<div id="vazio">Nenhum produto cadastrado ainda.</div>';
    return;
  }
  produtosCache.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const precoFmt = (p.preco !== undefined && p.preco !== null)
      ? Number(p.preco).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})
      : '';
    card.innerHTML = `
      <img src="${p.imagem || 'https://via.placeholder.com/400x300?text=Sem+imagem'}" alt="${p.nome || ''}">
      <div class="card-body">
        <h3>${p.nome || '(sem nome)'}</h3>
        <div class="preco">${precoFmt}</div>
        <p>${p.descricao || ''}</p>
      </div>
      ${usuarioLogado ? `
      <div class="card-actions">
        <button class="btn-ghost" onclick="window.editarProduto('${p.id}')">Editar</button>
        <button class="btn-danger" onclick="window.excluirProduto('${p.id}')">Excluir</button>
      </div>` : ''}
    `;
    grid.appendChild(card);
  });
}

// ---------- CRUD PRODUTO ----------
const overlayProduto = document.getElementById('overlayProduto');
fabNovo.onclick = () => abrirModalProduto();

function abrirModalProduto(produto=null) {
  document.getElementById('tituloModalProduto').textContent = produto ? 'Editar produto' : 'Novo produto';
  document.getElementById('produtoId').value = produto ? produto.id : '';
  document.getElementById('pNome').value = produto ? (produto.nome || '') : '';
  document.getElementById('pPreco').value = produto ? (produto.preco ?? '') : '';
  document.getElementById('pImagem').value = produto ? (produto.imagem || '') : '';
  document.getElementById('pDescricao').value = produto ? (produto.descricao || '') : '';
  overlayProduto.classList.add('show');
}
document.getElementById('cancelarProduto').onclick = () => overlayProduto.classList.remove('show');

document.getElementById('salvarProduto').onclick = async () => {
  const id = document.getElementById('produtoId').value;
  const dados = {
    nome: document.getElementById('pNome').value.trim(),
    preco: parseFloat(document.getElementById('pPreco').value) || 0,
    imagem: document.getElementById('pImagem').value.trim(),
    descricao: document.getElementById('pDescricao').value.trim()
  };
  if (!dados.nome) { alert('Digite o nome do produto.'); return; }
  try {
    if (id) {
      await updateDoc(doc(db, 'produtos', id), dados);
    } else {
      await addDoc(produtosRef, dados);
    }
    overlayProduto.classList.remove('show');
  } catch (e) {
    alert('Erro ao salvar: ' + e.message);
  }
};

window.editarProduto = (id) => {
  const p = produtosCache.find(x => x.id === id);
  if (p) abrirModalProduto(p);
};
window.excluirProduto = async (id) => {
  if (!confirm('Excluir este produto?')) return;
  try {
    await deleteDoc(doc(db, 'produtos', id));
  } catch (e) {
    alert('Erro ao excluir: ' + e.message);
  }
};
</script>
</body>
</html>
